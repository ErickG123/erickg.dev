<header class="manga-hero-wrapper manga-panel manga-panel--hero animate-hero-entrance" role="banner">
  
  <!-- CABEÇALHO DO FRONTISPÍCIO: METADADOS EDITORIAIS -->
  <div class="hero-meta mb-4">
    <div class="manga-flex manga-gap-2 manga-items-center manga-flex-wrap">
      <span class="hero-kicker">
        {{ hero().volumeId }}
      </span>
      <span class="hero-location">
        {{ hero().chapterId }}
      </span>
    </div>

    <div class="availability"><span class="status-dot"></span> Aberto a oportunidades
    </div>
  </div>

  <!-- COMPOSIÇÃO ASSIMÉTRICA: TEXTO + ILUSTRAÇÃO -->
  <div class="manga-grid manga-items-center">
    
    <!-- COLUNA DA ESQUERDA: IDENTIDADE TIPOGRÁFICA E TEXTOS -->
    <div class="col-7 hero-text-column">
      <div class="hero-author mb-2">
        {{ hero().authorName }} <span>·</span> {{ hero().authorRole }}
      </div>

      <!-- Título Principal Curto e Memorável -->
      <h1 class="manga-display-2xl hero-tagline" style="margin-bottom: var(--space-3); line-height: 1.02;">
        {{ hero().tagline }}
      </h1>

      <!-- Descrição Profissional Objetiva -->
      <p class="manga-body-lg hero-description" style="max-width: 620px; margin-bottom: var(--space-4); font-weight: 500;">
        {{ hero().description }}
      </p>

      <!-- Metadados de Arquitetura -->
      <div class="manga-flex manga-flex-wrap manga-gap-2 mb-6">
        <span class="manga-badge manga-badge--dark">ANGULAR 21 ZONELESS</span>
        <span class="manga-badge manga-badge--dark">CLEAN ARCHITECTURE</span>
        <span class="manga-badge manga-badge--dark">TYPESCRIPT</span>
        <span class="manga-badge manga-badge--vermilion">TEST-DRIVEN (JEST)</span>
      </div>

      <!-- Ações de Navegação -->
      <div class="manga-flex manga-flex-wrap manga-gap-3">
        <a [href]="hero().primaryCtaLink" class="manga-btn manga-btn--accent">
          {{ hero().primaryCtaText }} <span class="action-arrow-hover">&rarr;</span>
        </a>
        <a [href]="hero().secondaryCtaLink" class="manga-btn manga-btn--secondary">
          {{ hero().secondaryCtaText }} <span class="action-arrow-hover">&rarr;</span>
        </a>
      </div>
    </div>

    <!-- Retrato do autor -->
    <div class="col-5 hero-image-column">
      <div class="hero-image-frame">
        <app-manga-image
          [src]="hero().illustration.src"
          [alt]="hero().illustration.alt"
          [caption]="hero().illustration.caption"
          aspectRatio="1:1"
          [priority]="true"
        ></app-manga-image>
      </div>
    </div>

  </div>

  <!-- INDICAÇÃO DISCRETA DE CONTEÚDO ABAIXO (SCROLL PROMPT) -->
</header>
