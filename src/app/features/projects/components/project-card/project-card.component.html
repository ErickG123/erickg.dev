<article class="manga-panel h-full flex flex-column justify-between">
  <div>
    <div class="flex align-center justify-center mb-4" style="height: 8rem; background-color: var(--gba-bg); border-bottom: 2px solid var(--gba-border);">
       <span class="manga-heading-xl manga-text-vermilion" style="font-size: 2rem;">作品</span>
    </div>
    
    <h3 class="manga-heading-lg m-0 mb-2">{{ project().title }}</h3>
    
    <span class="manga-badge manga-badge--vermilion mb-3">Em evolução</span>
    
    <p class="m-0 mt-2">
      {{ project().description }}
    </p>
  </div>
  
  <div class="mt-4 pt-3" style="border-top: 1px solid var(--manga-border-subtle);">
    <a [href]="project().link" target="_blank" rel="noopener noreferrer" class="manga-btn manga-btn--secondary w-full text-center" style="display: block;">
      Ver projeto ↗
    </a>
  </div>
</article>
