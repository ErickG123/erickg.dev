<section class="contact-page container fadein mb-4 mt-4" aria-labelledby="contact-title">
  <header class="contact-heading">
    <span class="section-kicker">連絡 · {{ 'CONTACT.KICKER' | transloco }}</span>
    <h2 id="contact-title" class="manga-heading-xl">{{ 'CONTACT.TITLE' | transloco }}</h2>
    <p>{{ currentLang() === 'pt' ? author.contactIntro : author.contactIntroEn }}</p>
  </header>

  <div class="contact-links">
    @for (social of author.socialLinks; track social.name) {
      <a [href]="social.url" target="_blank" rel="noopener noreferrer" class="contact-link">
        <span class="contact-link-mark" aria-hidden="true">{{ social.iconLabel }}</span>
        <span class="contact-link-name">{{ social.name }}</span>
        <span class="contact-link-arrow" aria-hidden="true">↗</span>
      </a>
    }
  </div>
</section>
