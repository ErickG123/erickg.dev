<section class="container fadein mb-4 mt-4">
  <div class="flex align-center gap-2 mb-4" style="border-bottom: 2px dashed var(--gba-border-light); padding-bottom: 1rem;">
    <h2 class="pixel-font m-0" style="font-size: 2rem;">{{ 'HOME.GUILD_BOARD' | translate }}</h2>
  </div>

  <div class="contact-grid">
    
    <!-- Formulário (Esquerda) -->
    <section class="gba-card form-panel">
      <h3 class="pixel-font m-0 mb-4 pb-2" style="font-size: 1.2rem; border-bottom: 2px solid var(--gba-border-dark);"><span style="white-space: nowrap;">&gt;</span> {{ 'GUILD.TITLE' | translate }}</h3>
      
      <p class="description mb-4">
        {{ 'GUILD.SUBTITLE' | translate }}
      </p>

      <div class="flex flex-column gap-3">
        <div class="flex flex-column gap-1">
          <label for="name" class="pixel-font text-red" style="font-size: 0.7rem;">{{ 'GUILD.PLAYER_NAME' | translate }}</label>
          <input class="gba-input" id="name" type="text" [placeholder]="'GUILD.PLAYER_PLACEHOLDER' | translate" />
        </div>
        
        <div class="flex flex-column gap-1">
          <label for="email" class="pixel-font text-red" style="font-size: 0.7rem;">{{ 'GUILD.CONTACT_RUNES' | translate }}</label>
          <input class="gba-input" id="email" type="email" [placeholder]="'GUILD.CONTACT_PLACEHOLDER' | translate" />
        </div>
        
        <div class="flex flex-column gap-1">
          <label for="message" class="pixel-font text-red" style="font-size: 0.7rem;">{{ 'GUILD.QUEST_DETAILS' | translate }}</label>
          <textarea class="gba-input" id="message" rows="5" style="resize: none;" [placeholder]="'GUILD.QUEST_PLACEHOLDER' | translate"></textarea>
        </div>
        
        <div class="mt-3 text-right">
          <button class="gba-btn">{{ 'GUILD.TRANSMIT' | translate }}</button>
        </div>
      </div>
    </section>

    <!-- Redes Sociais (Direita) -->
    <section class="gba-card social-panel flex flex-column gap-4">
      <h3 class="pixel-font text-center m-0 pb-2" style="font-size: 1.2rem; border-bottom: 2px solid var(--gba-border-dark);"><span style="white-space: nowrap;">&gt;</span> SOCIAL_LINKS</h3>
      
      <div class="social-links-container mt-2">
        <a href="https://www.linkedin.com/in/erickgdev/" target="_blank" class="gba-btn gba-btn-secondary" style="justify-content: flex-start; padding-top: 1rem; padding-bottom: 1rem;">
          <span class="pixel-font text-red" style="margin-right: 0.75rem;">[ IN ]</span> LINKEDIN
        </a>
        
        <a href="https://dev.to/erickg123" target="_blank" class="gba-btn gba-btn-secondary" style="justify-content: flex-start; padding-top: 1rem; padding-bottom: 1rem;">
          <span class="pixel-font text-red" style="margin-right: 0.75rem;">[ DEV ]</span> DEV.TO
        </a>
      </div>
    </section>

  </div>
</section>
