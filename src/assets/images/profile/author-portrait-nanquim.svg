<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Retrato editorial em nanquim de Erick Gabriel">
  <defs>
    <!-- Retícula de Pontos Halftone -->
    <pattern id="halftone-portrait" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" opacity="0.3"/>
    </pattern>
    <pattern id="lines-portrait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111111" stroke-width="0.8" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Fundo Paper White -->
  <rect width="400" height="400" fill="#F4F0E9"/>

  <!-- Halo de Fundo com Retícula de Nanquim -->
  <circle cx="200" cy="200" r="160" fill="url(#halftone-portrait)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- Marcas de Corte de Enquadramento -->
  <path d="M 20 35 L 20 20 L 35 20 M 365 20 L 380 20 L 380 35 M 20 365 L 20 380 L 35 380 M 365 380 L 380 380 L 380 365" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Silhueta e Traço do Personagem: O Engenheiro (Erick Gabriel) -->
  <!-- Ombros e Jaqueta Bomber Urbana -->
  <path d="M 60 380 C 80 300 120 280 150 270 L 150 250 L 250 250 L 250 270 C 280 280 320 300 340 380 Z" fill="#111111" stroke="#111111" stroke-width="3"/>

  <!-- Gola Alta e Detalhes da Jaqueta -->
  <path d="M 160 250 L 200 285 L 240 250" fill="none" stroke="#F4F0E9" stroke-width="3"/>
  <line x1="200" y1="285" x2="200" y2="380" stroke="#D9363E" stroke-width="2.5"/> <!-- Zíper Vermilion com Destaque Pontual -->

  <!-- Fone Over-Ear nos Ombros (Acessório Urbano Técnico) -->
  <path d="M 130 255 C 120 240 120 220 135 210 C 145 205 155 215 150 235 Z" fill="#222222" stroke="#F4F0E9" stroke-width="1.5"/>
  <path d="M 270 255 C 280 240 280 220 265 210 C 255 205 245 215 250 235 Z" fill="#222222" stroke="#F4F0E9" stroke-width="1.5"/>
  <path d="M 135 220 C 150 260 250 260 265 220" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- Pescoço -->
  <path d="M 175 250 L 175 195 L 225 195 L 225 250 Z" fill="#F4F0E9" stroke="#111111" stroke-width="2.5"/>
  <!-- Sombra Nanquim do Queixo -->
  <polygon points="175,195 225,195 210,215 190,215" fill="#111111"/>

  <!-- Rosto e Cabeça (Perfil 3/4 Masculino Adulto Contemporâneo) -->
  <path d="M 160 140 C 160 185 180 210 200 210 C 220 210 240 185 240 140 C 240 100 220 85 200 85 C 180 85 160 100 160 140 Z" fill="#F4F0E9" stroke="#111111" stroke-width="2.5"/>

  <!-- Cabelo Curto e Texturizado em Nanquim Puro (Estilo Editorial Adulto) -->
  <path d="M 155 135 C 150 95 170 70 200 70 C 230 70 250 90 245 130 C 240 105 230 90 200 90 C 170 90 160 110 155 135 Z" fill="#111111"/>
  <path d="M 170 75 L 180 90 L 195 72 L 205 88 L 220 74 L 235 92 L 242 105 L 235 115 L 244 125" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- Feições: Olhar Focado e Analítico -->
  <!-- Sobrancelhas Definidas -->
  <path d="M 175 135 L 192 133" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 208 133 L 225 135" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Olhos com Pupilas Claras em Nanquim -->
  <ellipse cx="184" cy="142" rx="4" ry="2.5" fill="#111111"/>
  <ellipse cx="216" cy="142" rx="4" ry="2.5" fill="#111111"/>
  <line x1="178" y1="139" x2="190" y2="139" stroke="#111111" stroke-width="1.5"/>
  <line x1="210" y1="139" x2="222" y2="139" stroke="#111111" stroke-width="1.5"/>

  <!-- Nariz e Boca Discretos -->
  <path d="M 200 144 L 198 160 L 203 162" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="193" y1="176" x2="207" y2="176" stroke="#111111" stroke-width="2" stroke-linecap="round"/>

  <!-- Hanko Stamp Autoral Vermelho: ERICK // 江里克 -->
  <g transform="translate(305, 30) rotate(-4)">
    <rect x="0" y="0" width="65" height="65" fill="#F4F0E9" stroke="#D9363E" stroke-width="2.5" rx="3"/>
    <text x="32" y="27" font-family="'Anton', sans-serif" font-size="16" fill="#D9363E" text-anchor="middle">ERICK</text>
    <line x1="10" y1="33" x2="55" y2="33" stroke="#D9363E" stroke-width="1.5"/>
    <text x="32" y="52" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#D9363E" font-weight="900" text-anchor="middle">江里克</text>
  </g>

  <!-- Legenda Editorial Inferior -->
  <rect x="40" y="340" width="160" height="22" fill="#111111"/>
  <text x="120" y="355" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#F4F0E9" font-weight="700" text-anchor="middle">AUTHOR_ID // ERICK G.</text>
</svg>