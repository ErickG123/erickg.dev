<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ForensicLab | trilha de análise</title>
  <desc id="desc">Ilustração original de uma lente e uma sequência de pontos representando etapas de análise forense digital.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#292b27"/><stop offset="1" stop-color="#171816"/></linearGradient>
    <pattern id="tone" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f0eee8" opacity=".12"/></pattern>
    <radialGradient id="lens"><stop stop-color="#d87968" stop-opacity=".2"/><stop offset=".72" stop-color="#d87968" stop-opacity=".04"/><stop offset="1" stop-color="#d87968" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#tone)"/>
  <path d="M0 112H1200M0 566H1200" stroke="#f0eee8" stroke-opacity=".15"/>
  <text x="62" y="73" fill="#e28b79" font-family="monospace" font-size="18" letter-spacing="5">DIGITAL FORENSICS / 02</text>
  <text x="62" y="206" fill="#f0eee8" font-family="Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-4">ForensicLab</text>
  <text x="66" y="250" fill="#aaa99f" font-family="monospace" font-size="18" letter-spacing="3">OBSERVE · TRACE · DOCUMENT</text>
  <circle cx="900" cy="378" r="195" fill="url(#lens)" stroke="#d87968" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="900" cy="378" r="132" fill="none" stroke="#f0eee8" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 12"/>
  <path d="M1042 520l94 94" stroke="#d87968" stroke-width="18" stroke-linecap="square"/>
  <path d="M748 378h304M900 226v304" stroke="#d87968" stroke-opacity=".45" stroke-width="1"/>
  <g fill="#f0eee8"><circle cx="900" cy="246" r="5"/><circle cx="1032" cy="378" r="5"/><circle cx="900" cy="510" r="5"/><circle cx="768" cy="378" r="5"/></g>
  <path d="M66 427h416M66 465h294M66 503h362" stroke="#f0eee8" stroke-opacity=".24" stroke-width="2"/>
  <path d="M66 427h180" stroke="#d87968" stroke-width="3"/>
  <text x="62" y="625" fill="#aaa99f" font-family="monospace" font-size="15" letter-spacing="3">EVIDENCE, ORGANIZED WITH CARE</text>
