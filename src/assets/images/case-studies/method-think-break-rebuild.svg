<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" aria-label="Diagrama editorial do método de engenharia: Think, Break, Rebuild">
  <defs>
    <!-- Retícula de Pontos Halftone -->
    <pattern id="dots-method" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" opacity="0.3"/>
    </pattern>
    <pattern id="diag-method" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111111" stroke-width="1.2" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Fundo Paper White -->
  <rect width="800" height="400" fill="#F4F0E9"/>

  <!-- Painel Exterior com Borda de Nanquim -->
  <rect x="30" y="25" width="740" height="350" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Marcas de Corte Editoriais -->
  <path d="M 15 35 L 15 15 L 35 15 M 765 15 L 785 15 L 785 35 M 15 365 L 15 385 L 35 385 M 765 385 L 785 385 L 785 365" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Título do Diagrama no Topo -->
  <rect x="30" y="25" width="360" height="28" fill="#111111"/>
  <text x="45" y="44" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#F4F0E9" font-weight="700">ENGINEERING_PIPELINE // CONTINUOUS_CYCLE</text>

  <!-- ==========================================
       FASE 1: ACT I — THINK
       ========================================== -->
  <g transform="translate(60, 90)">
    <!-- Card Base -->
    <rect x="0" y="0" width="200" height="220" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="28" fill="#111111"/>
    <text x="12" y="19" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F4F0E9" font-weight="700">ACT I // MODELING</text>
    
    <text x="12" y="65" font-family="'Anton', sans-serif" font-size="28" fill="#111111">THINK</text>
    <text x="12" y="85" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#77736F" font-weight="700">DOMÍNIO & CONTRATOS</text>

    <!-- Ilustração de Esquema Técnico -->
    <rect x="12" y="105" width="176" height="60" fill="url(#dots-method)" stroke="#111111" stroke-width="1"/>
    <text x="24" y="128" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111" font-weight="700">interface UserContract {</text>
    <text x="24" y="142" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111">&nbsp;&nbsp;id: UUID;</text>
    <text x="24" y="156" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111">}</text>

    <!-- Tag Inferior -->
    <rect x="12" y="180" width="176" height="24" fill="#F4F0E9" stroke="#111111" stroke-width="1"/>
    <text x="100" y="196" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111" font-weight="700" text-anchor="middle">CLEAN ARCHITECTURE</text>
  </g>

  <!-- Seta Conectora 1 -> 2 -->
  <g transform="translate(268, 190)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#111111" stroke-width="3"/>
    <polygon points="30,-6 42,0 30,6" fill="#111111"/>
    <text x="20" y="-12" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#77736F" text-anchor="middle">SPECS</text>
  </g>

  <!-- ==========================================
       FASE 2: ACT II — BREAK (DESTAQUE VERMELHO)
       ========================================== -->
  <g transform="translate(300, 80)">
    <!-- Card com Destaque Dramático -->
    <rect x="0" y="0" width="200" height="240" fill="#FFFFFF" stroke="#D9363E" stroke-width="3"/>
    <rect x="0" y="0" width="200" height="32" fill="#D9363E"/>
    <text x="12" y="21" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FFFFFF" font-weight="800">ACT II // STRESS & CHAOS</text>

    <text x="12" y="70" font-family="'Anton', sans-serif" font-size="32" fill="#D9363E">BREAK</text>
    <text x="12" y="90" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#111111" font-weight="700">TESTES SOB ESTRESSE</text>

    <!-- Painel de Testes com Linhas Diagonais -->
    <rect x="12" y="110" width="176" height="70" fill="url(#diag-method)" stroke="#111111" stroke-width="1"/>
    <rect x="22" y="122" width="156" height="20" fill="#111111"/>
    <text x="100" y="136" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">PASS &bull; 53 UNIT TESTS</text>
    
    <text x="24" y="158" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D9363E" font-weight="700">&bull; FAULT INJECTION: OK</text>
    <text x="24" y="172" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111">&bull; CI GATE: UNBROKEN</text>

    <!-- Tag Inferior -->
    <rect x="12" y="195" width="176" height="26" fill="#111111"/>
    <text x="100" y="212" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#F4F0E9" font-weight="800" text-anchor="middle">RESILIENCE VALIDATED</text>
  </g>

  <!-- Seta Conectora 2 -> 3 -->
  <g transform="translate(508, 190)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#111111" stroke-width="3"/>
    <polygon points="30,-6 42,0 30,6" fill="#111111"/>
    <text x="20" y="-12" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#77736F" text-anchor="middle">TESTED</text>
  </g>

  <!-- ==========================================
       FASE 3: ACT III — REBUILD
       ========================================== -->
  <g transform="translate(540, 90)">
    <!-- Card Base -->
    <rect x="0" y="0" width="200" height="220" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="28" fill="#111111"/>
    <text x="12" y="19" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F4F0E9" font-weight="700">ACT III // PRODUCTION</text>

    <text x="12" y="65" font-family="'Anton', sans-serif" font-size="28" fill="#111111">REBUILD</text>
    <text x="12" y="85" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#77736F" font-weight="700">PERFORMANCE & BUNDLE</text>

    <!-- Ilustração de Otimização -->
    <rect x="12" y="105" width="176" height="60" fill="url(#dots-method)" stroke="#111111" stroke-width="1"/>
    <text x="24" y="126" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111" font-weight="700">BUNDLE: -45% (ZONELESS)</text>
    <text x="24" y="142" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111">BUILD: 4.4s &bull; PWA READY</text>
    <text x="24" y="156" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D9363E" font-weight="700">DEPLOY: VERCEL EDGE</text>

    <!-- Tag Inferior -->
    <rect x="12" y="180" width="176" height="24" fill="#F4F0E9" stroke="#111111" stroke-width="1"/>
    <text x="100" y="196" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#111111" font-weight="700" text-anchor="middle">CONTINUOUS DELIVERY</text>
  </g>

  <!-- Arco de Retroalimentação (Feedback Loop): 3 -> 1 -->
  <path d="M 640 320 C 640 360 160 360 160 320" fill="none" stroke="#111111" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="160,320 154,332 166,332" fill="#111111"/>
  <text x="400" y="355" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#77736F" font-weight="700" text-anchor="middle">
    CONTINUOUS FEEDBACK &bull; REFRACTOR &bull; REPEAT
  </text>

  <!-- Hanko Stamp Autoral Vermelho: METHOD // 鍛錬 -->
  <g transform="translate(685, 30) rotate(-4)">
    <rect x="0" y="0" width="60" height="60" fill="#F4F0E9" stroke="#D9363E" stroke-width="2" rx="3"/>
    <text x="30" y="24" font-family="'Anton', sans-serif" font-size="14" fill="#D9363E" text-anchor="middle">METHOD</text>
    <line x1="8" y1="29" x2="52" y2="29" stroke="#D9363E" stroke-width="1.2"/>
    <text x="30" y="47" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#D9363E" font-weight="900" text-anchor="middle">鍛錬</text>
  </g>
</svg>