<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Screentone Dots Pattern -->
    <pattern id="screentone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#77736F" opacity="0.35"/>
    </pattern>
    <style>
      .title { font-family: 'Anton', Impact, sans-serif; font-size: 82px; font-weight: 900; fill: #111111; letter-spacing: 2px; }
      .subtitle { font-family: 'Inter Tight', 'Arial Narrow', sans-serif; font-size: 32px; font-weight: 800; fill: #D9363E; letter-spacing: 1px; }
      .description { font-family: 'Inter', sans-serif; font-size: 22px; fill: #111111; line-height: 1.6; }
      .mono { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 700; fill: #77736F; }
      .badge-text { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; fill: #F4F0E9; }
      .hanko-text { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 900; fill: #D9363E; }
    </style>
  </defs>

  <!-- Papel de Fundo com Margens de Sangria -->
  <rect width="1200" height="630" fill="#F4F0E9"/>

  <!-- Painel de Retícula Decorativo à Direita -->
  <rect x="760" y="40" width="400" height="550" fill="url(#screentone)"/>
  <rect x="760" y="40" width="400" height="550" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- Sombra Sólida do Painel Principal -->
  <rect x="46" y="46" width="1114" height="544" fill="#111111"/>

  <!-- Painel Principal de Mangá (Canvas Nanquim) -->
  <rect x="40" y="40" width="1114" height="544" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>

  <!-- Faixa de Retícula no Topo -->
  <rect x="40" y="40" width="1114" height="32" fill="url(#screentone)"/>
  <line x1="40" y1="72" x2="1154" y2="72" stroke="#111111" stroke-width="3"/>

  <!-- Metadados de Cabeçalho -->
  <text x="70" y="62" class="mono">CHAPTER 00 // RUNTIME EDITION &bull; VOL. 01</text>
  <text x="1060" y="62" class="mono" text-anchor="end">2026.AUTUMN</text>

  <!-- Título Principal Editorial -->
  <text x="70" y="180" class="title">ERICK GABRIEL</text>
  <text x="70" y="235" class="subtitle">FULL-STACK SOFTWARE ENGINEER</text>

  <!-- Resumo da Trajetória -->
  <text x="70" y="300" class="description">Uma narrativa interativa em formato de mangá editorial sobre a arte de</text>
  <text x="70" y="335" class="description">forjar sistemas escaláveis, interfaces de alto desempenho e arquiteturas limpas.</text>

  <!-- Badges Técnicos -->
  <g transform="translate(70, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="36" fill="#111111"/>
    <text x="75" y="23" class="badge-text" text-anchor="middle">ANGULAR 21</text>
    
    <!-- Badge 2 -->
    <rect x="165" y="0" width="140" height="36" fill="#111111"/>
    <text x="235" y="23" class="badge-text" text-anchor="middle">ZONELESS</text>

    <!-- Badge 3 -->
    <rect x="320" y="0" width="150" height="36" fill="#111111"/>
    <text x="395" y="23" class="badge-text" text-anchor="middle">TYPESCRIPT</text>

    <!-- Badge 4 -->
    <rect x="485" y="0" width="160" height="36" fill="#D9363E"/>
    <text x="565" y="23" class="badge-text" text-anchor="middle">ARCHITECTURE</text>
  </g>

  <!-- Carimbo Hanko Autoral -->
  <g transform="translate(980, 430) rotate(-4)">
    <rect x="0" y="0" width="110" height="110" fill="#FFFFFF" stroke="#D9363E" stroke-width="4" rx="4"/>
    <text x="55" y="52" class="hanko-text" text-anchor="middle">ERICK</text>
    <line x1="15" y1="65" x2="95" y2="65" stroke="#D9363E" stroke-width="2"/>
    <text x="55" y="92" class="mono" fill="#D9363E" font-size="14" font-weight="900" text-anchor="middle">江里克</text>
  </g>

  <!-- Detalhe Gráfico de Moldura e Sarjeta -->
  <line x1="70" y1="510" x2="880" y2="510" stroke="#111111" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="540" class="mono" font-size="14">DOMÍNIO: ERICKG.DEV &bull; GITHUB: ERICKG123 &bull; LINKEDIN: ERICKGDEV</text>
</svg>
