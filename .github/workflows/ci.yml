name: System Build & Defense Wards (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-system:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Utilizando a versão LTS atual do Node
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci --legacy-peer-deps

      - name: Run Test Suite (Jest) 🛡️
        # Roda os testes garantindo que o processo encerre sem travar o CI
        run: npm run test:ci

      - name: Build Production Application 🔨
        # Garante que a aplicação compila perfeitamente no modo de produção
        run: npm run build
